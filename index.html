<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>SISTEMA NOC 72310</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&display=swap');
body { background: #000; color: #00ffff; font-family: 'Orbitron', sans-serif; padding: 20px; }
.header { display: flex; justify-content: space-between; border: 2px solid #00ffff; padding: 20px; box-shadow: 0 0 20px #00ffff; margin-bottom: 20px; }
.titulo { font-size: 24px; font-weight: 900; text-shadow: 0 0 10px #00ffff; }
.saldo { font-size: 28px; color: #ff00ff; text-shadow: 0 0 15px #ff00ff; font-weight: 900; animation: blink 1s infinite; }
@keyframes blink { 50% { opacity: 0.7; } }
.grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; }
.card { border: 2px solid #00ffff; padding: 20px; text-align: center; box-shadow: 0 0 15px #00ffff; background: rgba(0,255,255,0.03); }
.card h3 { font-size: 12px; color: #aaa; margin-bottom: 10px; }
.card p { font-size: 32px; color: #ff00ff; font-weight: 900; }
.box { border: 2px solid #ff00ff; padding: 15px; margin-top: 15px; box-shadow: 0 0 15px #ff00ff; }
</style>
</head>
<body>

<div class="header">
  <div class="titulo">LUCAS.DA.SILVA.LIMA<br><span style="font-size:12px; color:#ff00ff">SISTEMA NOC 72310 | PEI CANADÁ</span></div>
  <div class="saldo" id="cotacao-cad">R$ 130,78</div>
</div>

<div class="grid">
  <div class="card">
    <h3>MÓVEIS MONTADOS</h3>
    <p id="moveis">0</p>
    <div style="color:#00ff00; font-size:11px">10 ANOS VALIDADOS ✓</div>
  </div>
  <div class="card">
    <h3>VAGAS ABERTAS PEI</h3>
    <p id="vagas">0</p>
    <div style="color:#00ff00; font-size:11px">SCAN COMPLETO ✓</div>
  </div>
  <div class="card">
    <h3>SALÁRIO/H PEI</h3>
    <p id="salario">$0,00</p>
    <div style="color:#00ff00; font-size:11px">+10% VS MÉDIA NOC</div>
  </div>
</div>

<div class="box">
  <button style="width:100%; padding:15px; background:transparent; border:2px solid #ff00ff; color:#ff00ff; font-family:Orbitron; font-weight:700; cursor:pointer;">BAIXAR LMIA.PDF</button>
</div>

<script>
// Animação dos números
function animate(id, start, end, time) {
  let obj = document.getElementById(id);
  let range = end - start;
  let step = Math.abs(Math.floor(time / range));
  let current = start;
  let timer = setInterval(() => {
    current += 1;
    obj.innerHTML = current.toLocaleString('pt-BR');
    if (current >= end) clearInterval(timer);
  }, step);
}

// API BANCO CENTRAL - Dólar Canadense
async function atualizarCAD() {
  try {
    const url = 'https://api.bcb.gov.br/dados/serie/bcdata.sgs.3691/dados/ultimos/1?formato=json&_=' + new Date().getTime();
    const res = await fetch(url);
    const data = await res.json();
    const valor = parseFloat(data[0].valor).toFixed(2);
    
    // Atualiza o R$ do canto
    document.getElementById('cotacao-cad').innerText = `R$ ${valor.replace('.', ',')}`;
    
    // Atualiza o SALÁRIO/H PEI também
    document.getElementById('salario').innerText = `$${valor.replace('.', ',')}`;
    
  } catch(e) {
    console.log("Erro ao buscar CAD");
  }
}

// Inicia quando carrega
window.onload = () => {
  animate("moveis", 0, 14832, 2000);
  animate("vagas", 0, 3, 1000);
  atualizarCAD();
}

// ATUALIZA A CADA 4 SEGUNDOS
setInterval(atualizarCAD, 4000);
</script>

</body>
</html>
