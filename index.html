<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SISTEMA NOC STATUS CANADENSE</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap');
body {
  background: #050505;
  color: #00ffff;
  font-family: 'Orbitron', sans-serif;
  margin: 0;
  padding: 20px;
}
.header {
  display: flex;
  justify-content: space-between;
  border-bottom: 2px solid #ff00ff;
  padding-bottom: 10px;
  margin-bottom: 20px;
}
.nome { color: #00ffff; font-size: 18px; font-weight: bold; text-shadow: 0 0 5px #00ffff; }
.saldo { color: #ff00ff; font-size: 18px; text-shadow: 0 0 5px #ff00ff; }
.cards {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 15px;
  margin-bottom: 20px;
}
.card {
  border: 2px solid #00ffff;
  background: rgba(0,255,255,0.05);
  padding: 20px 10px;
  text-align: center;
  box-shadow: 0 0 15px #00ffff;
  border-radius: 8px;
}
.card h3 { font-size: 12px; color: #aaa; margin: 0 0 8px 0; }
.card p { font-size: 32px; color: #ff00ff; margin: 0; font-weight: bold; text-shadow: 0 0 8px #ff00ff; }
.box {
  border: 2px solid #ff00ff;
  padding: 15px;
  margin-bottom: 15px;
  box-shadow: 0 0 15px #ff00ff;
  border-radius: 8px;
}
.box h3 { color: #00ffff; margin: 0; text-shadow: 0 0 5px #00ffff; }
@media (max-width: 768px) {
  .cards { grid-template-columns: repeat(2, 1fr); }
}
</style>
</head>
<body>

<div class="header">
  <div class="nome">LUCAS.DA.SILVA.LIMA</div>
  <div class="saldo">R$ 4.32</div>
</div>

<div class="cards">
  <div class="card">
    <h3>SCORE NOC</h3>
    <p>87</p>
  </div>
  <div class="card">
    <h3>VALOR CAD</h3>
    <p id="cotacao">$34,20</p>
  </div>
  <div class="card">
    <h3>MOEDAS</h3>
    <p>14.832</p>
  </div>
  <div class="card">
    <h3>VAGAS</h3>
    <p>3</p>
  </div>
</div>

<div class="box">
  <h3>PROJEÇÃO SALARIAL 5 ANOS</h3>
</div>

<div class="box">
  <h3>RANKING CALCULADO</h3>
</div>

<script>
// API do Banco Central - Dólar Canadense
async function buscarCotacao() {
  try {
    const response = await fetch('https://api.bcb.gov.br/dados/serie/bcdata.sgs.3691/dados/ultimos/1?formato=json');
    const data = await response.json();
    const valor = parseFloat(data[0].valor).toFixed(2);
    document.getElementById('cotacao').innerText = `$${valor.replace('.', ',')}`;
  } catch (error) {
    console.log('Erro ao buscar cotação');
  }
}
buscarCotacao();
setInterval(buscarCotacao, 60000); // atualiza a cada 1 minuto
</script>

</body>
</html>
