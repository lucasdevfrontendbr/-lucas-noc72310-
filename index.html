<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>SISTEMA NOC</title>
<style>
body {
  background: #000;
  color: #00ffff;
  font-family: 'Orbitron', sans-serif;
  margin: 0;
  padding: 20px;
}
.header {
  display: flex;
  justify-content: space-between;
  border-bottom: 2px solid #ff00ff;
  padding-bottom: 10px;
  margin-bottom: 20px;
}
.nome { color: #00ffff; font-size: 18px; font-weight: bold; }
.saldo { color: #ff00ff; font-size: 18px; }
.cards {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 15px;
}
.card {
  border: 2px solid #00ffff;
  background: rgba(0,255,255,0.05);
  padding: 15px;
  text-align: center;
  box-shadow: 0 0 10px #00ffff;
}
.card h3 { font-size: 12px; color: #aaa; margin: 0; }
.card p { font-size: 28px; color: #ff00ff; margin: 5px 0; font-weight: bold; }
.projecao {
  margin-top: 20px;
  border: 2px solid #ff00ff;
  padding: 10px;
  box-shadow: 0 0 10px #ff00ff;
}
</style>
</head>
<body>

<div class="header">
  <div class="nome">LUCAS.DA.SILVA.LIMA</div>
  <div class="saldo">R$ 4.32</div>
</div>

<div class="cards">
  <div class="card">
    <h3>SCORE NOC</h3>
    <p>87</p>
  </div>
  <div class="card">
    <h3>VALOR CAD</h3>
    <p>$34,20</p>
  </div>
  <div class="card">
    <h3>MOEDAS</h3>
    <p>14.832</p>
  </div>
  <div class="card">
    <h3>VAGAS</h3>
    <p>3</p>
  </div>
</div>

<div class="projecao">
  <h3>PROJEÇÃO SALARIAL 5 ANOS</h3>
</div>

<div class="ranking">
  <h3>RANKING CALCULADO</h3>
</div>

</body>
</html>
