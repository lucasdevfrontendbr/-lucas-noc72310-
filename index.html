<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Monitor LMIA + Chance Visto</title>
<style>
body{font-family:Arial;background:#0f172a;color:white;text-align:center}
.card{background:#1e293b;padding:20px;margin:20px auto;border-radius:15px;max-width:650px}
h1{color:#22c55e} .vaga{background:#334155;padding:10px;margin:10px;border-radius:8px;text-align:left}
.tag{background:#22c55e;color:black;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:bold}
button{padding:12px 20px;border-radius:8px;border:none;font-weight:bold;cursor:pointer;margin:10px;background:#3b82f6;color:white}
#percent{font-size:42px;font-weight:bold}
</style>
</head>
<body>
<div class="card">
<h1>🇨🇦 Monitor de Vagas LMIA</h1>
<p>Atualizando a cada 4s | Job Bank + Indeed</p>
<div id="percent">--%</div>
<p id="detalhe">Chance de aprovação do seu visto fechado</p>
<hr>
<h3 id="total">0 vagas com LMIA encontradas hoje</h3>
<div id="lista"></div>
<button onclick="calcular()">RECALCULAR MINHA CHANCE</button>
</div>

<script>
// SEU PERFIL - edita aqui
let perfil = {
  idioma: 7, // CLB 7
  experiencia: 3, // anos
  idade: 28,
  tem_oferta_lmia: true
}

let vagasMock = [
  {titulo: "Administrative Assistant - LMIA Approved", cidade: "Toronto, ON", salario: "$22/h"},
  {titulo: "Cook - LMIA Available", cidade: "Calgary, AB", salario: "$18/h"},
  {titulo: "Truck Driver - LMIA Approved", cidade: "Winnipeg, MB", salario: "$28/h"}
];

function calculaChance(p){
  let base = 40;
  if(p.tem_oferta_lmia) base += 30;
  base += p.idioma * 3;
  base += p.experiencia * 2;
  if(p.idade >= 22 && p.idade <= 35) base += 10;
  if(base > 95) base = 95;
  return base;
}

function atualizar(){
  let chance = calculaChance(perfil);
  document.getElementById('percent').innerText = chance + '%';
  document.getElementById('total').innerText = vagasMock.length + ' vagas com LMIA encontradas hoje';
  
  let lista = document.getElementById('lista');
  lista.innerHTML = '';
  vagasMock.forEach(v => {
    lista.innerHTML += `<div class="vaga"><span class="tag">LMIA</span> <b>${v.titulo}</b><br>${v.cidade} - ${v.salario}</div>`;
  });

  // simula vaga nova aparecendo
  if(Math.random() > 0.7){
    vagasMock.unshift({titulo: "Nova vaga LMIA encontrada agora! - Warehouse Worker", cidade: "Saskatoon, SK", salario: "$21/h"});
  }
}
setInterval(atualizar, 4000);
atualizar();

function calcular(){
  let novaIdade = prompt("Sua idade?", perfil.idade);
  if(novaIdade) perfil.idade = parseInt(novaIdade);
  atualizar();
}
</script>
</body>
</html>
